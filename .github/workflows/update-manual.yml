name: Update Obsidian release assets

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[update-release-assets]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Attach Obsidian files directly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload 0.4.0 main.js manifest.json styles.css --clobber
          # Obsidian's community validator downloads only these three files.
          gh release delete-asset 0.4.0 literacy-assessment-0.4.0.zip --yes || true
          gh release delete-asset 0.4.0 literacy-teacher-workbench-manual-0.4.0.pdf --yes || true
          gh release edit 0.4.0 --notes-file "docs/release-notes-v0.4.0.md"
