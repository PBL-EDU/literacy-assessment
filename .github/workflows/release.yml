name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Package release
        run: |
          mkdir -p release dist
          cp main.js manifest.json styles.css LICENSE release/
          cp "docs/素养教师工作台-操作手册-v0.4.0.pdf" "release/literacy-teacher-workbench-manual-${GITHUB_REF_NAME}.pdf"
          (cd release && zip -r "../dist/literacy-assessment-${GITHUB_REF_NAME}.zip" .)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; keeping assets."
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/literacy-assessment-${GITHUB_REF_NAME}.zip" \
            "release/literacy-teacher-workbench-manual-${GITHUB_REF_NAME}.pdf" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "docs/release-notes-v0.4.0.md" \
            --latest
