# action.dreamook.com vhost
# Install to /etc/nginx/sites-available/action.conf, symlink into sites-enabled,
# then run: certbot --nginx -d action.dreamook.com
server {
    listen 80;
    server_name action.dreamook.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name action.dreamook.com;

    ssl_certificate /etc/letsencrypt/live/action.dreamook.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/action.dreamook.com/privkey.pem;

    # OCR upload path can be large; keep the app's own limit lower.
    client_max_body_size 110m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
}
