services:
  literacy-db:
    image: postgres:16-bookworm
    container_name: literacy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: literacy
      POSTGRES_USER: literacy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
    volumes:
      - literacy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U literacy -d literacy"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    networks: [literacy-net]

  literacy-api:
    build: .
    container_name: literacy-api
    restart: unless-stopped
    depends_on:
      literacy-db:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:3010:3010"
    mem_limit: 256m
    networks: [literacy-net]

volumes:
  literacy_pgdata:

networks:
  literacy-net:
    driver: bridge
